" textLength="228.779" font-family="'Segoe UI'">──────────────────────────────────────</text><text x="427" y="183.546" fill="#BF360C" font-size="10" textLength="53.82" font-family="'Segoe UI'">Se requiere</text><text x="483.42" y="183.546" fill="#BF360C" font-size="10" textLength="90.4" font-weight="700" font-family="'Segoe UI'">registro y entrega</text><text x="427" y="197.166" fill="#BF360C" font-size="10" textLength="89.48" font-family="'Segoe UI'">obligatoria&lt;/b> de:</text><text x="427" y="210.786" fill="#BF360C" font-size="10" textLength="123.16" font-family="'Segoe UI'">• Documento de identidad</text><text x="427" y="224.406" fill="#BF360C" font-size="10" textLength="199.22" font-family="'Segoe UI'">• Compromiso de responsabilidad firmado</text><text x="427" y="238.026" fill="#BF360C" font-size="10" textLength="228.779" font-family="'Segoe UI'">──────────────────────────────────────</text><text x="427" y="251.646" fill="#BF360C" font-size="10" textLength="144.07" font-family="'Segoe UI'">Antes de cambiar el estado del</text><text x="427" y="265.266" fill="#BF360C" font-size="10" textLength="53.54" font-family="'Segoe UI'">préstamo a</text><text x="483.14" y="265.266" fill="#BF360C" font-size="10" textLength="40.75" font-weight="700" font-family="'Segoe UI'">"Activo"</text></g><g class="entity" data-qualified-name="GMN11" id="ent0012" data-source-line="120"><path d="M868,847.636 L868,917.636 L849.75,921.636 L868,925.636 L868,995.836 A4,4 0 0 0 872,999.836 L1129.8,999.836 A4,4 0 0 0 1133.8,995.836 L1133.8,853.636 L1123.8,843.636 L872,843.636 A4,4 0 0 0 868,847.636" style="stroke:#BF360C;stroke-width:0.5;" fill="#FBE9E7"/><path d="M1123.8,843.636 L1123.8,851.636 A2,2 0 0 0 1125.8,853.636 L1133.8,853.636 L1123.8,843.636" style="stroke:#BF360C;stroke-width:0.5;" fill="#FBE9E7"/><text x="879" y="864.326" fill="#BF360C" font-size="10" textLength="75.81" font-weight="700" font-family="'Segoe UI'">RF09 - Garantía</text><text x="879" y="877.946" fill="#BF360C" font-size="10" textLength="234.8" font-family="'Segoe UI'">═══════════════════════════════════════</text><text x="879" y="891.566" fill="#BF360C" font-size="10" textLength="169.53" font-family="'Segoe UI'">El sistema debe registrar la garantía</text><text x="879" y="905.186" fill="#BF360C" font-size="10" textLength="149.73" font-family="'Segoe UI'">dejada por el usuario al solicitar</text><text x="879" y="918.806" fill="#BF360C" font-size="10" textLength="165.5" font-family="'Segoe UI'">un préstamo, cuando corresponda.</text><text x="879" y="932.426" fill="#BF360C" font-size="10" textLength="228.779" font-family="'Segoe UI'">──────────────────────────────────────</text><text x="879" y="946.046" fill="#BF360C" font-size="10" textLength="150.28" font-weight="700" font-family="'Segoe UI'">Casos que requieren garantía:</text><text x="879" y="959.666" fill="#BF360C" font-size="10" textLength="104.71" font-family="'Segoe UI'">• Equipos de alto valor</text><text x="879" y="973.286" fill="#BF360C" font-size="10" textLength="187.13" font-family="'Segoe UI'">• Excepción Académica (Tier Restringido</text><text x="884.2" y="986.906" fill="#BF360C" font-size="10" textLength="165.81" font-family="'Segoe UI'">accediendo a bien de Tier Superior)</text></g><g class="entity" data-qualified-name="GMN14" id="ent0015" data-source-line="133"><path d="M6,881.636 L6,961.736 A4,4 0 0 0 10,965.736 L267.8,965.736 A4,4 0 0 0 271.8,961.736 L271.8,925.636 L290.175,921.636 L271.8,917.636 L271.8,887.636 L261.8,877.636 L10,877.636 A4,4 0 0 0 6,881.636" style="stroke:#BF360C;stroke-width:0.5;" fill="#FBE9E7"/><path d="M261.8,877.636 L261.8,885.636 A2,2 0 0 0 263.8,887.636 L271.8,887.636 L261.8,877.636" style="stroke:#BF360C;stroke-width:0.5;" fill="#FBE9E7"/><text x="17" y="898.326" fill="#BF360C" font-size="10" textLength="122.74" font-weight="700" font-family="'Segoe UI'">Ciclo de vida de garantía</text><text x="17" y="911.946" fill="#BF360C" font-size="10" textLength="234.8" font-family="'Segoe UI'">═══════════════════════════════════════</text><text x="17" y="925.566" fill="#BF360C" font-size="10" textLength="187.25" font-family="'Segoe UI'">PENDIENTE → REGISTRADA → LIBERADA</text><text x="76.8" y="939.186" fill="#BF360C" font-size="10" textLength="56.36" font-family="'Segoe UI'">↘ RETENIDA</text><text x="22.2" y="952.806" fill="#BF360C" font-size="10" textLength="145.73" font-family="'Segoe UI'">(cuando hay daño del material)</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-link-type="composition"><polygon points="549,785.225,545,791.225,549,797.225,553,791.225,549,785.225" fill="#455A64" style="stroke:#455A64;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M549,797.225 C549,814.121 549,818.422 549,833.505" style="stroke:#455A64;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk6" data-link-type="composition"><polygon points="429.169,785.225,422.878,788.748,423.711,795.911,430.002,792.388,429.169,785.225" fill="#455A64" style="stroke:#455A64;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M423.711,795.911 C417.42,808.226 416.75,809.537 410.906,820.978" style="stroke:#455A64;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk7" data-link-type="composition"><polygon points="676.002,774.402,675.485,781.595,681.926,784.838,682.443,777.646,676.002,774.402" fill="#455A64" style="stroke:#455A64;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M681.926,784.838 C691.082,800.97 694.081,806.254 702.474,821.042" style="stroke:#455A64;stroke-width:1;" fill="none"/><text x="682.002" y="766.023" fill="#546E7A" font-size="9" textLength="15.12" font-family="'Segoe UI'">0..1</text></g><?plantuml-src pHVBRjj6yEwl6BY7sdNaoebaHOPhW18fWuKi6g8S8401OqMkg4r8BhExTE8M0NBAkIXQeDVsbaCFHJz1V-8lwUoAb4XLxiL5N48mbpEpytvPCHLJwFDKqNUAdu3FfA89WP32EH4aLOi_YFmkFPsUNV2GnbmZR9wmb76mRVlqw-dP